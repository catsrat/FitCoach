<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FitCoach is offline</title>
<meta name="theme-color" content="#000000">
<style>
* { box-sizing: border-box; margin: 0; }
body { background: #000000; color: #FFFFFF; font-family: "Geist", system-ui, sans-serif; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; }
main { max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
h1 { font-size: 24px; line-height: 32px; font-weight: 600; text-wrap: balance; }
p { font-size: 16px; line-height: 24px; color: #9B9B9B; text-wrap: pretty; }
a { display: inline-flex; padding: 8px 12px; border-radius: 8px; background: #B8F04A; color: #131209; font-size: 16px; line-height: 24px; font-weight: 600; text-decoration: none; transition: opacity 300ms cubic-bezier(0.22, 1, 0.36, 1), transform 300ms cubic-bezier(0.22, 1, 0.36, 1); }
a:hover { opacity: 0.88; }
a:active { transform: scale(0.98); }
a:focus-visible { outline: 2px solid #B8F04A; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>FitCoach needs a connection to count your meals and reach your coach. Nothing you logged is lost.</p>
  <a href="/">Try again</a>
</main>
</body>
</html>
